<h1>阶跃和千里科技，达成全面战略合作</h1>
<div class="meta"><span class="score">5</span> <span class="tier">官方动态</span>  2026-04-23 · StepFun / StepFun</div>
<div class="tags"><span class="vendor-tag">StepFun</span><span class="tag">方向:端云协同</span><span class="tag">方向:多模态</span></div>
<div class="field"><span class="label">这是什么</span><span class="text">阶跃星辰与千里科技宣布全面战略合作，从底层共建原生智驾基座模型，并表示将聚焦“AI+终端”，把大模型放进更多终端设备。</span></div>
<div class="field"><span class="label">有什么结果</span><span class="text">未报告</span></div>
<div class="field"><span class="label">怎么做到</span><span class="text">双方从模型训练第一天起就让模型直接学习复杂物理世界；阶跃提到已开源面向智能体的基座模型 Step 3.5 Flash，并构建了端云协同的全模态模型矩阵。</span></div>
<div class="score-reason">评分依据：车端智驾模型和“AI+终端”属端侧方向，但这是合作公告，没有技术或部署细节。</div>
